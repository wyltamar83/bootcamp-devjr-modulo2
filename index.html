<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootcamp DevJr - Sistema de Assinaturas</title>

    <style>

        body{
            background-color: #F5F5F5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

         .container{
            background-color: #E8E8E8;
            margin: auto;

            width:600px;

            box-shadow: 1px 3px 8px 1px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            overflow: hidden;
        } 

        .header{
            padding: 40px;
        }

         .flex-container{
            display: flex;
            background-color: #006D6C;
            justify-content: space-around;
            
         }

         .header-title{
            color: #006D6C;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;

         }

         .header-subtitle{
            color: #008C8A;
            padding-bottom: 15px;
            font-size: 19px;
            font-weight: 500;
         }

         .column-left{
            color: #FFFFFF;
            background-color:#006D6C; 
            width: 50%;
            padding: 20px;
         }

         .column-right{
            color: #FFF;
            background-color:#008C8A;
            width: 50%;
            padding: 20px;
         }

         .title-column1{
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
         }
         .price{
            font-size: 25px;
            font-weight: 700;
            padding-right: 15px;
         }

         .month{
            font-size: 15px;
            font-style: italic;
         }

         .offer-colun1{
            padding-left: 2px;
            margin-bottom: 20px;
         }

         button{
            background-color: #CBCBCB;
            color:#006D6C;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            padding: 15px 32px;
            width: 100%;
            margin-bottom: 30px;
            margin-top: 20px;
            cursor: pointer;
         }

         button:hover{
            background-color: #E9E9E9;
         }


    </style>
</head>
<body>
    
</body>
        <div class="container">
            <div class="header">
                 <div class="header-title">
                      Entre para a nossa comunidade!
                 </div>
                 <div class="header-subtitle">
                       Faça a sua assinatura agora e ganhe 30% de desconto!
                 </div>
                 <div>
                       Faça parte da nossa comunidade de desenvoldedores.<br>
                       Tenha suporte da nossa equipe e cresça mais rápido na sua carreira.
                 </div>
           </div>
            <div class="flex-container"> 
                <div class="column-left">
                    <div class="title-column1">
                        Assinatura mensal:
                    </div>
                    <div class="offer-colun1">
                        <span class="price">R$ 99,99 </span>
                        <span class="month">por mês.</span> <br> 
                        Cancele a qualquer momento.
                    </div>
                    <div>
                        <button type="button">Assine Agora</button>
                    </div>

                </div>
                <div class="column-right">
                    coluna 2
                </div>
            </div>

        </div>
</html>
