<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootcamp FullStack Iniciante</title>
    <style>

        body{
            background-color: #F5F5F5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container{
            background-color: #E8E8E8;
            margin: auto;

            width: 600px;

            box-shadow: 1px 3px 8px 1px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            overflow: hidden;

        }

        .flex-container{
            display: flex;
            background-color: #006D6C;
            justify-content: space-around;
            flex-direction: column;
            align-items: center;

        }  
        
        .header{
            padding: 2.5rem;
            color: #006D6C;
        }

        .header-title{
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.6rem;
        }

        .header-subtitle{
            font-size: 1.1rem;
            font-weight: 500;
        }

        .icon{
            padding: 0.6rem 1.2rem;
        }

        button{

            color: #006B6A;
            font-size: 1.1rem;
            background-color: #CBCBCB;
            margin-top: 1.6rem;
            margin-bottom: 1.8rem;
            border: none;
            border-radius: 4px;
            padding: 0.9rem 3rem;

        }

    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="header-title">
            Cadastro
        </div>

        <div class="header-subtitle">
            Faça o seu cadastro para entrar na nossa comunidade e ter<br>
            todos os benefícios.
        </div>

    </div>

    <div class="flex-container">
        <div class="icon">
            <object data="groups_48dp_FFFFFF_FILL0_wght400_GRAD0_opsz48.svg" type="image/svg+xml"></object>
        </div>

        <div>
            <button type="button">Cadastrar</button>
        </div>

    </div>
</div>
</body>
</html>
